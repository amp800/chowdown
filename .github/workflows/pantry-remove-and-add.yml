name: Remove from Pantry and Add to Grocery

on:
  workflow_dispatch:
    inputs:
      action:
        description: "remove_staple or remove_on_hand"
        required: true
      item:
        description: "Item name"
        required: true

concurrency:
  group: pantry-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Remove from pantry and add to grocery list
        run: |
          python - <<'EOF'
          import yaml, re, sys
          from pathlib import Path

          action = "${{ inputs.action }}"
          item   = "${{ inputs.item }}"

          # --- Remove from pantry ---
          pantry_path = Path("_data/pantry.yml")
          pantry = yaml.safe_load(pantry_path.read_text(encoding="utf-8")) if pantry_path.exists() else {}
          pantry.setdefault("staples", [])
          pantry.setdefault("on_hand", [])

          if action == "remove_staple":
              before = len(pantry["staples"])
              pantry["staples"] = [s for s in pantry["staples"] if s.lower() != item.lower()]
              print(f"Removed staple: {item}" if len(pantry["staples"]) < before else f"Staple not found: {item}")
          elif action == "remove_on_hand":
              before = len(pantry["on_hand"])
              pantry["on_hand"] = [e for e in pantry["on_hand"] if e.get("item","").lower() != item.lower()]
              print(f"Removed on_hand: {item}" if len(pantry["on_hand"]) < before else f"On-hand not found: {item}")
          else:
              print(f"Unknown action: {action}", file=sys.stderr)
              sys.exit(1)

          pantry_path.write_text(
              yaml.dump(pantry, default_flow_style=False, allow_unicode=True, sort_keys=False),
              encoding="utf-8",
          )

          # --- Add to grocery list ---
          grocery_path = Path("_data/grocery_list.yml")
          grocery = yaml.safe_load(grocery_path.read_text(encoding="utf-8")) if grocery_path.exists() else {}
          grocery.setdefault("recipes", [])

          pantry_group = next((g for g in grocery["recipes"] if g.get("recipe") == "Pantry Needs"), None)
          if pantry_group is None:
              pantry_group = {"recipe": "Pantry Needs", "items": []}
              grocery["recipes"].append(pantry_group)

          if item not in pantry_group["items"]:
              pantry_group["items"].append(item)
              print(f"Added '{item}' to grocery list")
          else:
              print(f"'{item}' already in grocery list")

          grocery_path.write_text(
              yaml.dump(grocery, default_flow_style=False, allow_unicode=True),
              encoding="utf-8",
          )
          EOF

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Pantry: remove ${{ inputs.item }} → grocery list"
          file_pattern: "_data/pantry.yml _data/grocery_list.yml"
