name: Add Recipe to Plan

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Recipe slug to add to this week"
        required: true

jobs:
  plan-add:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Add recipe to current week
        run: |
          python - <<'EOF'
          import yaml, os
          from datetime import date, timedelta
          from pathlib import Path

          slug = os.environ["SLUG"]
          today = date.today()
          monday = today - timedelta(days=today.weekday())
          week_of = str(monday)
          days = ["monday","tuesday","wednesday","thursday","friday","saturday","sunday"]

          plan_path = Path("_data/meal_plan.yml")
          plan = {}
          if plan_path.exists():
              plan = yaml.safe_load(plan_path.read_text()) or {}

          # Reset if it's a different week
          if plan.get("week_of") != week_of:
              plan = {"week_of": week_of}

          # Fill the first empty day
          for day in days:
              if not plan.get(day):
                  plan[day] = slug
                  print(f"Added {slug} to {day}")
                  break
          else:
              print("All days already filled — recipe not added")

          plan_path.parent.mkdir(exist_ok=True)
          plan_path.write_text(yaml.dump(plan, default_flow_style=False, sort_keys=False), encoding="utf-8")
          EOF
        env:
          SLUG: ${{ inputs.slug }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Plan: add ${{ inputs.slug }} to this week"
          file_pattern: "_data/meal_plan.yml"
