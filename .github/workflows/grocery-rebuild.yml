name: Rebuild Grocery List

on:
  workflow_dispatch:

jobs:
  grocery:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Build grocery list from meal plan
        run: |
          python - <<'EOF'
          import yaml, re
          from pathlib import Path
          from datetime import date

          CATEGORIES = [
              ("Freezer", ["frozen"]),
              ("Meat & Fish", [
                  "chicken", "beef", "pork", "lamb", "turkey", "sausage", "bacon", "ham",
                  "shrimp", "prawn", "salmon", "tuna", "cod", "fish", "seafood", "anchovy",
                  "crab", "lobster", "mussel", "scallop", "prosciutto", "pancetta",
                  "steak", "thigh", "breast", "wing", "drumstick", "tenderloin", "brisket",
                  "loin", "cutlet", "fillet", "filet", "halibut", "tilapia", "flounder",
                  "trout", "sardine", "mackerel", "duck",
              ]),
              ("Dairy & Eggs", [
                  "milk", "heavy cream", "whipping cream", "half-and-half", "half and half",
                  "butter", "cheese", "yogurt", "egg", "sour cream", "cream cheese",
                  "parmesan", "mozzarella", "cheddar", "feta", "ricotta", "mascarpone",
                  "brie", "gouda", "gruyere", "goat cheese", "cottage cheese", "ghee",
                  "creme fraiche", "cream",
              ]),
              ("Grains & Bread", [
                  "pasta", "rice", "noodle", "bread", "flour", "oats", "oat ",
                  "quinoa", "tortilla", "pita", "farro", "barley", "bulgur", "couscous",
                  "cracker", "panko", "bread crumb", "breadcrumb", "cornmeal", "polenta",
                  "linguine", "spaghetti", "fettuccine", "rigatoni", "penne", "fusilli",
                  "orzo", "udon", "ramen", "soba", "vermicelli", "lasagna", "dumpling",
              ]),
              ("Canned & Jarred", [
                  "canned ", "(15-ounce) can", "(14-ounce) can", "(28-ounce) can",
                  "chickpea", "lentil", "black bean", "kidney bean", "white bean",
                  "navy bean", "pinto bean", "cannellini", "coconut milk",
                  "tomato paste", "diced tomatoes", "crushed tomatoes", "whole tomatoes",
                  "stock", "broth", "olives", "capers", "tahini", "miso", "sun-dried",
              ]),
              ("Pantry & Staples", [
                  "garlic powder", "onion powder", "chili powder", "curry powder",
                  "red pepper flakes", "red-pepper flakes", "black pepper", "white pepper",
                  "kosher salt", "sea salt", "flaky salt", "cream of tartar",
                  "olive oil", "sesame oil", "vegetable oil", "canola oil", "coconut oil",
                  "baking powder", "baking soda", "vanilla extract",
                  "soy sauce", "fish sauce", "hot sauce", "oyster sauce", "hoisin sauce",
                  "sriracha", "gochujang", "worcestershire",
                  "rice vinegar", "apple cider vinegar", "balsamic vinegar",
                  "maple syrup", "corn syrup", "lemon juice", "lime juice",
                  "oil", "vinegar", "salt", "pepper", "sugar", "honey",
                  "mustard", "ketchup", "mayonnaise", "mayo", "cumin", "turmeric",
                  "paprika", "coriander", "cinnamon", "cayenne", "bay leaf",
                  "yeast", "cornstarch", "molasses", "tamari", "mirin", "sake",
                  "extract", "seasoning", "spice", "powder", "dried ", "ground ",
                  "flakes",
              ]),
              ("Produce", [
                  "apple", "banana", "strawberr", "blueberr", "raspberr", "blackberr",
                  "berry", "berries", "lemon", "lime", "orange", "mango", "avocado",
                  "tomato", "onion", "garlic", "ginger", "carrot", "celery", "potato",
                  "kale", "spinach", "lettuce", "arugula", "cucumber", "zucchini",
                  "pepper", "broccoli", "cauliflower", "mushroom", "corn", "shallot",
                  "scallion", "leek", "chard", "collard", "cabbage", "beet", "parsnip",
                  "squash", "eggplant", "fennel", "asparagus", "mint", "cilantro",
                  "parsley", "basil", "thyme", "rosemary", "sage", "dill", "chive",
                  "jalapen", "serrano", "greens", "bok choy", "peach", "plum", "pear",
                  "grape", "cherry", "pineapple", "melon", "watermelon", "fig",
                  "radish", "turnip", "artichoke", "watercress", "endive",
                  "sweet potato", "snap pea", "edamame", "tomatillo",
              ]),
          ]
          CATCHALL = "Other"

          def categorize(ingredient):
              s = ingredient.lower()
              for cat_name, keywords in CATEGORIES:
                  for kw in keywords:
                      if kw in s:
                          return cat_name
              return CATCHALL

          # ── Pantry / on-hand matching ────────────────────────────────────────────
          STOP_WORDS = {"the", "and", "for", "with", "from", "est", "org", "organic",
                        "per", "each", "pack", "count", "size", "box", "bag", "can"}

          pantry_path = Path("_data/pantry.yml")
          pantry_data = yaml.safe_load(pantry_path.read_text()) if pantry_path.exists() else {}

          pantry_terms = []
          # Staples: clean short strings e.g. "olive oil", "garlic"
          for s in pantry_data.get("staples", []):
              term = str(s).strip().lower()
              if term:
                  pantry_terms.append(term)

          # on_hand: parse verbose receipt names, extract first meaningful phrase
          for entry in pantry_data.get("on_hand", []):
              item_text = entry.get("item", "") if isinstance(entry, dict) else str(entry)
              # Stop at first digit (quantity/price noise)
              clean = re.split(r"\s+\d", item_text)[0].strip().lower()
              clean = re.sub(r"[^a-z\s'-]", " ", clean).strip()
              words = [w for w in clean.split() if len(w) > 2 and w not in STOP_WORDS]
              if len(words) >= 3:
                  pantry_terms.append(" ".join(words[:3]))
              if len(words) >= 2:
                  pantry_terms.append(" ".join(words[:2]))
              if words:
                  pantry_terms.append(words[0])

          def is_on_hand(ingredient):
              s = " " + ingredient.strip().lower() + " "
              for term in pantry_terms:
                  if not term:
                      continue
                  if " " in term:
                      if term in s:
                          return True
                  else:
                      if re.search(r"\b" + re.escape(term) + r"\b", s):
                          return True
              return False

          # ── Load meal plan & collect ingredients ──────────────────────────────────
          plan_path = Path("_data/meal_plan.yml")
          if not plan_path.exists():
              print("No meal_plan.yml found")
              raise SystemExit(0)

          plan = yaml.safe_load(plan_path.read_text()) or {}
          days = ["monday","tuesday","wednesday","thursday","friday","saturday","sunday"]
          slugs = [plan.get(d, "") for d in days if plan.get(d)]

          seen = set()
          buckets = {}
          for slug in slugs:
              recipe_path = Path(f"_recipes/{slug}.md")
              if not recipe_path.exists():
                  continue
              raw = recipe_path.read_text(encoding="utf-8")
              parts = raw.split("---", 2)
              if len(parts) < 3:
                  continue
              try:
                  fm = yaml.safe_load(parts[1]) or {}
              except yaml.YAMLError:
                  continue
              for ingredient in fm.get("ingredients", []):
                  key = ingredient.strip().lower()
                  if key in seen:
                      continue
                  seen.add(key)
                  cat = categorize(ingredient.strip())
                  buckets.setdefault(cat, []).append(ingredient.strip())

          category_order = [name for name, _ in CATEGORIES] + [CATCHALL]
          categories = []
          for n in category_order:
              if n not in buckets:
                  continue
              need = [i for i in buckets[n] if not is_on_hand(i)]
              have = [i for i in buckets[n] if is_on_hand(i)]
              entry = {"name": n}
              if need:
                  entry["items"] = need
              if have:
                  entry["have"] = have
              if need or have:
                  categories.append(entry)

          out = Path("_data/grocery_list.yml")
          out.write_text(
              yaml.dump(
                  {"week_of": str(date.today()), "categories": categories},
                  default_flow_style=False, allow_unicode=True
              ),
              encoding="utf-8"
          )
          buy_count = sum(len(c.get("items", [])) for c in categories)
          have_count = sum(len(c.get("have", [])) for c in categories)
          print(f"Wrote {buy_count} items to buy, {have_count} on hand, in {len(categories)} categories")
          EOF

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Rebuild grocery list from meal plan"
          file_pattern: "_data/grocery_list.yml"
