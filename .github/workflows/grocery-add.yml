name: Add to Grocery List

on:
  workflow_dispatch:
    inputs:
      item:
        description: "Item to add to the grocery list"
        required: true

concurrency:
  group: pantry-data
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Add item to grocery list
        run: |
          python - <<'EOF'
          import yaml
          from pathlib import Path

          item = "${{ inputs.item }}"
          path = Path("_data/grocery_list.yml")

          data = yaml.safe_load(path.read_text(encoding="utf-8")) if path.exists() else {}
          data.setdefault("recipes", [])

          # Find or create a "Pantry Needs" group for manually added items
          pantry_group = next(
              (g for g in data["recipes"] if g.get("recipe") == "Pantry Needs"), None
          )
          if pantry_group is None:
              pantry_group = {"recipe": "Pantry Needs", "items": []}
              data["recipes"].append(pantry_group)

          if item not in pantry_group["items"]:
              pantry_group["items"].append(item)
              print(f"Added '{item}' to grocery list under Pantry Needs")
          else:
              print(f"'{item}' already in grocery list")

          path.write_text(
              yaml.dump(data, default_flow_style=False, allow_unicode=True),
              encoding="utf-8",
          )
          EOF

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Grocery list: add ${{ inputs.item }} from pantry"
          file_pattern: "_data/grocery_list.yml"
          pull_before_commit: true
