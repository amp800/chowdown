name: Save Meal Plan

on:
  workflow_dispatch:
    inputs:
      week_of:
        description: "ISO date of Monday (e.g. 2026-05-11)"
        required: true
      monday:
        required: false
        default: ""
      tuesday:
        required: false
        default: ""
      wednesday:
        required: false
        default: ""
      thursday:
        required: false
        default: ""
      friday:
        required: false
        default: ""
      saturday:
        required: false
        default: ""
      sunday:
        required: false
        default: ""

jobs:
  save-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Write meal_plan.yml
        run: |
          python - <<'EOF'
          import yaml, os
          from pathlib import Path

          plan = {
            "week_of": os.environ["WEEK_OF"],
            "monday":    os.environ.get("MONDAY", ""),
            "tuesday":   os.environ.get("TUESDAY", ""),
            "wednesday": os.environ.get("WEDNESDAY", ""),
            "thursday":  os.environ.get("THURSDAY", ""),
            "friday":    os.environ.get("FRIDAY", ""),
            "saturday":  os.environ.get("SATURDAY", ""),
            "sunday":    os.environ.get("SUNDAY", ""),
          }
          out = Path("_data/meal_plan.yml")
          out.parent.mkdir(exist_ok=True)
          out.write_text(yaml.dump(plan, default_flow_style=False, sort_keys=False), encoding="utf-8")
          print("Wrote _data/meal_plan.yml")
          EOF
        env:
          WEEK_OF:    ${{ inputs.week_of }}
          MONDAY:     ${{ inputs.monday }}
          TUESDAY:    ${{ inputs.tuesday }}
          WEDNESDAY:  ${{ inputs.wednesday }}
          THURSDAY:   ${{ inputs.thursday }}
          FRIDAY:     ${{ inputs.friday }}
          SATURDAY:   ${{ inputs.saturday }}
          SUNDAY:     ${{ inputs.sunday }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update meal plan for ${{ inputs.week_of }}"
          file_pattern: "_data/meal_plan.yml"
