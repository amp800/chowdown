name: Update Pantry

on:
  workflow_dispatch:
    inputs:
      action:
        description: "add_staple / remove_staple / remove_on_hand / clear_on_hand"
        required: true
      item:
        description: "Item name (leave blank for clear_on_hand)"
        required: false
        default: ""

concurrency:
  group: pantry-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Update pantry
        run: |
          python tools/pantry_update.py \
            --action "${{ inputs.action }}" \
            --item "${{ inputs.item }}"

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Pantry: ${{ inputs.action }}${{ inputs.item != '' && format(' {0}', inputs.item) || '' }}"
          file_pattern: "_data/pantry.yml"
