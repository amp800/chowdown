name: Update Last Made

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Recipe slug (filename without .md)"
        required: true

jobs:
  update-made:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Set last_made to today
        run: |
          python - <<'EOF'
          import re, os
          from datetime import date
          from pathlib import Path

          slug = os.environ["SLUG"]
          recipe_path = Path(f"_recipes/{slug}.md")

          if not recipe_path.exists():
              print(f"ERROR: {recipe_path} not found", flush=True)
              raise SystemExit(1)

          today = str(date.today())
          raw = recipe_path.read_text(encoding="utf-8")
          parts = raw.split("---", 2)
          if len(parts) < 3:
              print("ERROR: could not parse frontmatter")
              raise SystemExit(1)

          fm_text = parts[1]
          pattern = re.compile(r"^(last_made:\s*)(.*)$", re.MULTILINE)
          if pattern.search(fm_text):
              new_fm = pattern.sub(rf"\g<1>{today}", fm_text)
          else:
              new_fm = fm_text.rstrip("\n") + f"\nlast_made: {today}\n"

          recipe_path.write_text("---" + new_fm + "---" + parts[2], encoding="utf-8")
          print(f"Updated last_made to {today} in {recipe_path}")
          EOF
        env:
          SLUG: ${{ inputs.slug }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Mark ${{ inputs.slug }} as made today"
          file_pattern: "_recipes/*.md"
