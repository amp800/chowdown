name: Parse Receipt Email

on:
  workflow_dispatch:
    inputs:
      store:
        description: "Store: freshdirect / wholefoods / auto"
        required: true
        default: "auto"
      email_text:
        description: "Paste the full receipt email text here"
        required: true

jobs:
  parse:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Write email text to file
        env:
          EMAIL_TEXT: ${{ inputs.email_text }}
        run: printf '%s' "$EMAIL_TEXT" > /tmp/receipt.txt

      - name: Parse receipt and update pantry
        run: |
          python tools/parse_receipt.py \
            --store "${{ inputs.store }}" \
            --email_file /tmp/receipt.txt

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update on_hand from ${{ inputs.store }} receipt"
          file_pattern: "_data/pantry.yml"
