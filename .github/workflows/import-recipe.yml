name: Import Recipe

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Recipe URL to import"
        required: true
      tags:
        description: "Space-separated tags (e.g. chicken quick)"
        required: false
        default: ""

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install recipe-scrapers requests pyyaml beautifulsoup4

      - name: Scrape and write recipe
        run: |
          python tools/importer/scrape.py \
            --url "${{ inputs.url }}" \
            --tags "${{ inputs.tags }}"

      - name: Commit recipe
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Import recipe from ${{ inputs.url }}"
          file_pattern: "_recipes/*.md images/*"
