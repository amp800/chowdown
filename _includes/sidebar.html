<style>
  /* ===== SIDEBAR STYLES (defined once here) ===== */
  .home-sidebar {
    width: 280px;
    background: #111;
    position: fixed;
    height: 100vh;
    top: 0; left: 0;
    z-index: 50;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-accent-bar {
    height: 6px;
    background: linear-gradient(90deg, #E63946 0%, #c62828 100%);
    flex-shrink: 0;
  }

  .sidebar-content {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 32px 28px 24px;
  }

  .site-title {
    display: block;
    text-decoration: none;
    margin-bottom: 44px;
    padding-bottom: 20px;
    border-bottom: 1px solid #2a2a2a;
  }

  .site-title .title-owner {
    display: block;
    font-family: 'Jost', sans-serif;
    font-weight: 900;
    font-size: 1.45rem;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    line-height: 1;
  }

  .site-title .title-owner span {
    color: #E63946;
  }

  .site-title .title-sub {
    display: block;
    font-family: 'Jost', sans-serif;
    font-weight: 400;
    font-size: 0.65rem;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    margin-top: 7px;
  }

  nav {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'Jost', sans-serif;
    font-size: 0.82rem;
    font-weight: 700;
    color: #888;
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 11px 14px;
    border-left: 3px solid transparent;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }

  .nav-item .nav-icon {
    font-size: 1rem;
    width: 20px;
    text-align: center;
    flex-shrink: 0;
  }

  .nav-item:hover {
    color: #fff;
    border-left-color: #E63946;
    background: rgba(255,255,255,0.05);
  }

  .nav-item.active {
    color: #fff;
    border-left-color: #E63946;
    background: rgba(230,57,70,0.12);
  }

  .sidebar-footer {
    margin-top: auto;
    padding-top: 20px;
    border-top: 1px solid #222;
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .sidebar-footer-dots {
    display: flex;
    gap: 5px;
  }

  .sidebar-footer-dots span {
    width: 9px;
    height: 9px;
    border-radius: 50%;
  }

  .sidebar-footer-label {
    font-family: 'Jost', sans-serif;
    font-size: 0.6rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: #444;
    margin-left: 4px;
  }

  @media (max-width: 900px) {
    .home-sidebar {
      width: 100%;
      height: auto;
      position: relative;
      flex-direction: column;
    }

    .sidebar-content {
      flex-direction: row;
      align-items: center;
      padding: 14px 20px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .site-title {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .site-title .title-sub { display: none; }

    nav { flex-direction: row; gap: 4px; flex-wrap: wrap; }

    .nav-item { padding: 8px 12px; }
    .nav-item .nav-icon { display: none; }

    .sidebar-footer { display: none; }
    .sidebar-accent-bar { height: 4px; }
  }
</style>

<aside class="home-sidebar">
  <div class="sidebar-accent-bar"></div>
  <div class="sidebar-content">
    <a href="{{ "/" | relative_url }}" class="site-title">
      <span class="title-owner"><span>billmiky</span>'s</span>
      <span class="title-sub">Recipe Collection</span>
    </a>
    <nav>
      <a href="{{ "/" | relative_url }}" class="nav-item{% if page.url == "/" %} active{% endif %}">
        <span class="nav-icon">⊞</span> Recipes
      </a>
      <a href="{{ "/meal-plan/" | relative_url }}" class="nav-item{% if page.url contains "meal-plan" %} active{% endif %}">
        <span class="nav-icon">◫</span> Meal Plan
      </a>
      <a href="{{ "/grocery-list/" | relative_url }}" class="nav-item{% if page.url contains "grocery-list" %} active{% endif %}">
        <span class="nav-icon">▤</span> Grocery
      </a>
      <a href="{{ "/search.html" | relative_url }}" class="nav-item{% if page.url contains "search" %} active{% endif %}">
        <span class="nav-icon">◎</span> Search
      </a>
      <a href="{{ "/import/" | relative_url }}" class="nav-item{% if page.url contains "import" %} active{% endif %}">
        <span class="nav-icon">⊕</span> Import
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-footer-dots">
        <span style="background:#E63946;"></span>
        <span style="background:#F4A261;"></span>
        <span style="background:#2A9D8F;"></span>
      </div>
      <span class="sidebar-footer-label">Bauhaus Edition</span>
    </div>
  </div>
</aside>
